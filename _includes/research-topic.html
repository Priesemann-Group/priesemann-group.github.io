<section class="research-topic" aria-labelledby="research-topic-{{ include.topic.id }}">
  <h2 id="research-topic-{{ include.topic.id }}">{{ include.topic.title }}</h2>
  <p>{{ include.topic.description }}</p>
  <details class="research-publications">
    <summary>Selected publications</summary>
    <ul class="publication-list">
      {% for publication_id in include.topic.publications %}
        {% assign publication = site.data.selected_publications[publication_id] %}
        {% include publication-card.html publication=publication %}
      {% endfor %}
    </ul>
  </details>
</section>
