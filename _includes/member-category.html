<section class="directory-section" aria-labelledby="member-category-{{ include.category.id }}">
  <h2 id="member-category-{{ include.category.id }}">{{ include.category.title | escape }}</h2>
  <ul class="people-list">
    {% for member in include.category.members %}
      <li>
        {% if member.url %}
          <a href="{{ member.url | escape }}" target="_blank" rel="noopener noreferrer">{{ member.name | escape }}</a>
        {% else %}
          {{ member.name | escape }}
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</section>
