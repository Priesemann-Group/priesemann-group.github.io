<li class="publication">
  <a href="https://doi.org/{{ include.publication.doi | escape }}" target="_blank" rel="noopener noreferrer">{{ include.publication.title }}</a>
  <span class="publication__authors">{{ include.publication.authors }}</span>
  <span class="publication__venue">{{ include.publication.journal }}, <time datetime="{{ include.publication.year }}">{{ include.publication.year }}</time>.</span>
</li>
