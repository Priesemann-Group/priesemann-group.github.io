<article class="join-program" aria-labelledby="join-program-{{ include.program.id }}">
  <h3 id="join-program-{{ include.program.id }}">{{ include.program.title | escape }}</h3>
  <p class="entry-meta">{{ include.program.audience | escape }} · {{ include.program.application_window | escape }}</p>
  <p>{{ include.program.description }}</p>
  <p><a href="{{ include.program.url | escape }}" target="_blank" rel="noopener noreferrer">{{ include.program.link_label | escape }}</a></p>
</article>
