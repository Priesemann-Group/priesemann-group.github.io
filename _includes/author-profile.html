{% include base_path %}
{% assign author = site.author %}

<div itemscope itemtype="https://schema.org/Person">
  <div class="author__avatar">
    <img
      src="{{ author.avatar_light | relative_url }}"
      class="author__avatar author__avatar--light"
      alt="{{ author.name | escape }}"
      fetchpriority="high"
      itemprop="image"
    >
    <img
      src="{{ author.avatar | relative_url }}"
      class="author__avatar author__avatar--dark"
      alt=""
      aria-hidden="true"
    >
  </div>

  <div class="author__content">
    <h3 class="author__name" itemprop="name">{{ author.name }}</h3>
    <p class="author__bio" itemprop="description">{{ author.bio }}</p>
  </div>

  <div class="author__urls-wrapper">
    <button
      class="btn btn--inverse"
      type="button"
      aria-expanded="false"
      aria-controls="author-profile-links"
    >Profiles</button>
    <ul id="author-profile-links" class="author__urls social-icons">
      <li class="author__desktop author__location">
        <a href="{{ author.location_url | escape }}" rel="noopener noreferrer">
          {{ author.location }}
        </a>
      </li>
      <li class="author__desktop author__affiliation">
        <a href="{{ author.employer_url | escape }}" rel="noopener noreferrer">
          {{ author.employer }}
        </a>
      </li>
      <li>
        <a href="{{ author.arxiv | escape }}" rel="noopener noreferrer">
          arXiv
        </a>
      </li>
      <li>
        <a href="{{ author.googlescholar | escape }}" rel="noopener noreferrer">
          Google Scholar
        </a>
      </li>
      <li>
        <a href="{{ author.orcid | escape }}" rel="noopener noreferrer">
          ORCID
        </a>
      </li>
      <li>
        <a href="https://github.com/{{ author.github | escape }}" rel="noopener noreferrer">
          GitHub
        </a>
      </li>
      <li>
        <a href="{{ author.mastodon | escape }}" rel="me noopener noreferrer">
          Mastodon
        </a>
      </li>
      <li>
        <a href="https://twitter.com/{{ author.twitter | escape }}" rel="noopener noreferrer">
          X
        </a>
      </li>
    </ul>
  </div>
</div>
