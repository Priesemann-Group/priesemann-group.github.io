<section class="directory-section" aria-labelledby="collaboration-area-{{ include.area.id }}">
  <h2 id="collaboration-area-{{ include.area.id }}">{{ include.area.title | escape }}</h2>
  <ul class="people-list collaborator-list">
    {% for collaborator in include.area.collaborators %}
      <li>
        {% if collaborator.url %}
          <a href="{{ collaborator.url | escape }}" target="_blank" rel="noopener noreferrer">{{ collaborator.name | escape }}</a>
        {% else %}
          {{ collaborator.name | escape }}
        {% endif %}
        <span class="collaborator-list__affiliation">{{ collaborator.affiliation | escape }}</span>
      </li>
    {% endfor %}
  </ul>
</section>
