locale: "en-US"
theme: null
site_theme: "priesemann"
title: "MPRG Priesemann"
title_separator: "-"
name: "PriesemannLab"
description: "Physics, Complex Systems & Neural Networks"
url: "https://priesemann-group.github.io"
baseurl: ""
repository: "Priesemann-Group/priesemann-group.github.io"

author:
  avatar: "viola_400x400.jpg"
  name: "Prof. Dr. Viola Priesemann"
  bio: "Max Planck Research Group Leader Complex Systems Theory"
  location: "Göttingen"
  location_url: "https://en.wikipedia.org/wiki/G%C3%B6ttingen"
  employer: "MPI for Dynamics and Self-Organization"
  employer_url: "https://www.ds.mpg.de/en/"
  arxiv: "https://arxiv.org/search/?query=viola+priesemann&searchtype=all&source=header"
  googlescholar: "https://scholar.google.de/citations?user=5oK8Ek4AAAAJ&hl=de"
  orcid: "https://orcid.org/0000-0001-8905-5873"
  github: "Priesemann-Group"
  mastodon: "https://mastodon.social/@ViolaPriesemann"
  twitter: "ViolaPriesemann"

breadcrumbs: false
exclude:
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - content/overview.html
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - preview.sh
  - README.md
  - vendor
encoding: "utf-8"

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Europe/Berlin

plugins:
  - jekyll-sitemap

compress_html:
  clippings: all
  # Keep JavaScript line boundaries intact in production. The chaos article's
  # inline plotting code uses line comments and automatic semicolon insertion.
  blanklines: true
  ignore:
    envs: development
